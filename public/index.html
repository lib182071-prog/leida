<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Content Radar</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fa; color: #222; }
    h1 { margin-bottom: 8px; }
    .sub { color: #666; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 10px; vertical-align: top; }
    th { background: #f1f3f5; text-align: left; }
    a { color: #0b57d0; text-decoration: none; }
    .muted { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <h1>AI Content Radar</h1>
  <div class="sub">Hacker News 热点 + AI 中文摘要</div>
  <table id="table">
    <thead>
      <tr>
        <th>中文标题</th>
        <th>原始标题</th>
        <th>摘要</th>
        <th>内容角度</th>
        <th>平台</th>
        <th>评分</th>
        <th>原始链接</th>
        <th>创建时间</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadArticles() {
      const tbody = document.querySelector('#table tbody');
      tbody.innerHTML = '<tr><td colspan="8">加载中...</td></tr>';
      try {
        const res = await fetch('/api/articles');
        const data = await res.json();
        const items = data.items || [];

        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="8">暂无数据，请等待定时任务执行。</td></tr>';
          return;
        }

        tbody.innerHTML = items.map(item => `
          <tr>
            <td>${escapeHtml(item.title_cn || '')}</td>
            <td>${escapeHtml(item.original_title || '')}</td>
            <td>${escapeHtml(item.summary_cn || '')}</td>
            <td>${escapeHtml(item.content_angle || '')}</td>
            <td>${escapeHtml(item.platform || '')}</td>
            <td>${item.score ?? ''}</td>
            <td><a href="${escapeAttr(item.source_url || '#')}" target="_blank" rel="noopener noreferrer">查看原文</a></td>
            <td class="muted">${escapeHtml(item.created_at || '')}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8">加载失败：${escapeHtml(e.message || 'unknown error')}</td></tr>`;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    loadArticles();
  </script>
</body>
</html>
